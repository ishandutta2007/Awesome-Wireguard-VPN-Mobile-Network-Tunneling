<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b19" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- WireGuard Red/Orange Gradient -->
    <linearGradient id="wg-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>

    <!-- Cyan Tunnel Gradient -->
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.3" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Dynamic Pulse Animations -->
    <style>
      @keyframes dash {
        to {
          stroke-dashoffset: -100;
        }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 0.7; transform: scale(1.08); }
      }
      @keyframes floatParticle {
        0% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
        50% { transform: translateY(-15px) translateX(10px); opacity: 0.8; }
        100% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
      }
      .tunnel-line {
        stroke-dasharray: 8, 12;
        animation: dash 5s linear infinite;
      }
      .tunnel-line-rev {
        stroke-dasharray: 6, 10;
        animation: dash 7s linear infinite reverse;
      }
      .pulse-circle {
        transform-origin: center;
        animation: pulseGlow 4s ease-in-out infinite;
      }
      .particle-1 { animation: floatParticle 6s ease-in-out infinite; }
      .particle-2 { animation: floatParticle 8s ease-in-out 1s infinite; }
      .particle-3 { animation: floatParticle 7s ease-in-out 2s infinite; }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="100%" height="100%" fill="url(#bg-grad)" />
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Ambient Dynamic Circuit / Tunnel Waves in Background -->
  <g opacity="0.35">
    <path d="M-50,220 C200,160 400,280 600,200 C800,120 1000,260 1250,180" fill="none" stroke="url(#cyan-glow)" stroke-width="2.5" class="tunnel-line" />
    <path d="M-50,250 C250,300 450,150 700,240 C950,310 1050,160 1250,220" fill="none" stroke="url(#wg-grad)" stroke-width="2" class="tunnel-line-rev" />
    <path d="M-50,120 C300,60 500,180 800,100 C1000,40 1150,140 1250,90" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="4, 8" />
  </g>

  <!-- Dynamic Glowing Mesh Nodes (Background) -->
  <g class="particle-1">
    <circle cx="150" cy="80" r="4" fill="#06b6d4" filter="url(#glow)" />
    <circle cx="1080" cy="90" r="5" fill="#f97316" filter="url(#glow)" />
  </g>
  <g class="particle-2">
    <circle cx="100" cy="270" r="6" fill="#8b5cf6" filter="url(#glow)" />
    <circle cx="1120" cy="260" r="4" fill="#10b981" filter="url(#glow)" />
  </g>
  <g class="particle-3">
    <circle cx="950" cy="50" r="3" fill="#38bdf8" />
    <circle cx="220" cy="220" r="5" fill="#f43f5e" filter="url(#glow)" />
  </g>

  <!-- Geometric Accent Corner Rings -->
  <circle cx="60" cy="60" r="90" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.15" class="pulse-circle" />
  <circle cx="1140" cy="280" r="110" fill="none" stroke="#f97316" stroke-width="1" opacity="0.15" class="pulse-circle" />

  <!-- WireGuard Inspired Shield & Tunnel Cyber Icon (Center Left Foreground) -->
  <g transform="translate(100, 105)">
    <!-- Hexagon Outer Shield -->
    <polygon points="45,5 85,25 85,75 45,95 5,75 5,25" fill="#1e293b" stroke="url(#wg-grad)" stroke-width="3" filter="url(#glow)" />
    <!-- Tunnel Gateway Rays -->
    <path d="M25,50 L65,50 M35,35 L55,65 M35,65 L55,35" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="45" cy="50" r="7" fill="#ef4444" />
  </g>

  <!-- Foreground Title Header -->
  <text x="210" y="135" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="40" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
    WireGuard VPN &amp; Mobile Network Tunneling
  </text>

  <!-- Foreground Subtitle / Tagline -->
  <text x="212" y="175" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#94a3b8">
    Curated Hub for Mesh Overlay Networks, Auto-Tunneling Clients, Zero-Trust Gateways &amp; Censorship Circumvention
  </text>

  <!-- Feature Pills Badges Container (Always clearly in Foreground) -->
  <g transform="translate(212, 210)">
    <!-- Pill 1: WireGuard Protocol -->
    <rect x="0" y="0" width="130" height="32" rx="16" fill="#1e293b" stroke="#ef4444" stroke-width="1.5" />
    <text x="65" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#fca5a5" text-anchor="middle">⚡ WIREGUARD</text>

    <!-- Pill 2: Mobile Roaming -->
    <rect x="142" y="0" width="165" height="32" rx="16" fill="#1e293b" stroke="#f97316" stroke-width="1.5" />
    <text x="224.5" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#fdba74" text-anchor="middle">📱 MOBILE TUNNELING</text>

    <!-- Pill 3: Mesh Networks -->
    <rect x="319" y="0" width="155" height="32" rx="16" fill="#1e293b" stroke="#06b6d4" stroke-width="1.5" />
    <text x="396.5" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#67e8f9" text-anchor="middle">🌐 MESH OVERLAYS</text>

    <!-- Pill 4: Zero Trust & Privacy -->
    <rect x="486" y="0" width="150" height="32" rx="16" fill="#1e293b" stroke="#10b981" stroke-width="1.5" />
    <text x="561" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#6ee7b7" text-anchor="middle">🔒 ZERO TRUST &amp; ZTNA</text>

    <!-- Pill 5: Censorship Bypass -->
    <rect x="648" y="0" width="165" height="32" rx="16" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5" />
    <text x="730.5" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#c4b5fd" text-anchor="middle">🛡️ OBFUSCATION / DPI</text>
  </g>
</svg>
